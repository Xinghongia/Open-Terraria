name: Build dist

# 手动触发 + 推送 main 时自动构建；产物 dist/ 以 artifact 形式产出
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: build-dist-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Normalize mtimes
        run: |
          # clone 侧没有仓库外的 l10n 源目录(tools/l10n，tools/l10n-custom)。
          # checkout 时文件写入顺序不同会让"构建脚本比 public/l10n 产物新"，
          # 从而误触发 vite 插件的自动重建。统一 mtime 消除这个竞态。
          find . -path ./node_modules -prune -o -type f -print0 | xargs -0 touch -t 202001010000

      - name: Build
        run: |
          set -e
          # 上游 build 链第一段是 `node scripts/build-l10n.mjs`，它读仓库外的
          # ../tools/l10n 分片源——clone 侧不存在（语言包成品 public/l10n/*.json
          # 已随仓跟踪，无需再生成），故跳过该步，其余步骤原样照跑。
          node scripts/stamp-build.mjs
          node scripts/vanilla-atlas.mjs --index-only
          node scripts/pack-assets.mjs
          npx tsc
          npx vite build
          node scripts/prune-dist.mjs
          node scripts/gen-sw-twa.mjs
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Report dist size
        run: |
          echo "=== dist 体积 ==="
          du -sh dist
          echo "=== 文件数 ==="
          find dist -type f | wc -l
          echo "=== 顶层 ==="
          ls -la dist | head -30

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraria-dist
          path: dist
          retention-days: 30
          compression-level: 6
          if-no-files-found: error
